name: Fast CI

on:
  push:
    branches: [develop/fes2026-next]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt pygame==2.6.1
      - run: python -m pytest
      - run: ruff check deepface_ver/core deepface_ver/scripts deepface_ver/tests deepface_ver/ui
      - run: ruff format --check deepface_ver/core deepface_ver/scripts deepface_ver/tests deepface_ver/ui
